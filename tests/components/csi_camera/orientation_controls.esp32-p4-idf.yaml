esphome:
  name: csi-camera-orientation-test

esp32:
  board: esp32-p4-evboard
  variant: ESP32P4
  framework:
    type: esp-idf

logger:

psram:

i2c:
  sda: GPIO7
  scl: GPIO8

csi_camera:
  id: csi_cam
  name: P4 Camera
  sensor: ov5647
  mode: 1080p30
  address: 0x36
  power_down_pin: 27
  ldo_chan: 3
  ldo_mv: 2500
  frame_buffer_count: 3
  enable_ccm: false
  saturation: 1.5
  contrast: 1.0
  horizontal_mirror: true
  vertical_flip: true
  test_pattern: false
